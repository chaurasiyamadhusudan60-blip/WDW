<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment18</title>
</head>
<body>
    <p><b>Courses and Fees</b></p>
    <table border="1" height="120" width="360">
    <tr>
        <th>Course</th>
        <th>Seats</th>
        <th>Fee</th>
    </tr>
    <tr>
        <td>B.Tech CSE</td>
        <td>120</td>
        <td>90000</td>
    </tr>
    <tr>
        <td>BCA</td>
        <td>60</td>
        <td>45000</td>
    </tr>
    </table>
    <form>
        <p>Application Form</p>
         <tr>
             <td>
                Name:
                <input type="text" id="name" name="name" size="30">
             </td>
         </tr>
         <br>
         <br>
         <tr>
            <td>
                Email:
                <input type="email" id="email" name="email" size="30">
            </td>
         </tr>
         <br>
         <br>
         <tr>
            <td>
                Course:
                <select name="course" id="course">
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="BCA">BCA</option>
                </select>
            </td>
         </tr>
         <br>
         <br>
         <tr>
            <td>
                Statement:
                <input type="text" id="statement" name="statement" size="30">
            </td>
         </tr>
         <br>
         <br>
         <input type="Apply" value="Apply">
    </form>
</body>
</html>
