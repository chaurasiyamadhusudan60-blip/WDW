<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form> 
        <table align="center">
        <h1 align="center">Student Registration Form</h1>
        <tr>
            <td>
                Student Name:
                <input type="text" size="30" placeholder="Name">
            </td>
        </tr>
         <tr>
            <td>
                Father's Name:
                <input type="text" size="30">
            </td>
            </tr>
             <tr>
            <td>
                Mother's Name:
                <input type="text" size="30">
            </td>
            </tr>
            <tr>
                <td>
                    Date of Birth:
                    <input type="Date" size="30">
                </td>
            </tr>
            <tr>
                <td>
                    Mobile number:
                    <input type="number" size="30">
                </td>
            </tr>
            <tr>
                <td>
                    Email Id:
                    <input type="email" size="30">
                </td>
            </tr>
            <tr>
                <td>
                    Password:
                    <input type="password" size="30">
                </td>
            </tr>
             <td>
                    Gender:
                    <select>
                        <option type="Gender" value="Male">Male</option>
                        <option type="Gender" value="Female">Female</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Department:
                    <select>
                        <option value="CSE">CSE</option>
                         <option value="IT">IT</option> 
                         <option value="MECH">MECH</option>
                          <option value="CIVIL">CIVIL</option>
                           <option value="ELECTRICAL">ELECTRICAL</option>
                            <option value="ECE">ECE</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    Course:
                    <Select>
                        <option value="Course">Select Current Course's</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="M.Tech">M.Tech</option>
                    </Select>
                </td>
            </tr>
            <tr>
                <td>
                    City:
                    <input type="text" Value="City">
                </td>
            </tr>
            <tr>
                <td>
                    Address:
                    <input type="text/number" value="Adderss">
                </td>
            </tr>
            <tr>
                <td>
                    Student photo:
                    <input type="file" value="choose file" height="5" width="5">
                </td>
            </tr>
             <tr>
                <td>
                    Student Signature:
                    <input type="file" value="choose file" height="5" width="5">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>
               

        </table>
    </form>
    
</body>
</html>
